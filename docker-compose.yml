version: '3.8'

services:
  # ==========================================
  # 1. Store Intelligence Core Service
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store_intelligence_backend
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - DEBUG=false
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=store_intelligence
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - postgres
      - kafka
    volumes:
      - ./backend/static:/app/backend/static
    restart: unless-stopped
    networks:
      - store_intelligence_network

  # ==========================================
  # 2. Production PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: store_intelligence_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=store_intelligence
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - store_intelligence_network

  # ==========================================
  # 3. Message Broker (Kafka & Zookeeper)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: cp_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - store_intelligence_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: cp_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - store_intelligence_network

  # ==========================================
  # 4. Observability Stack
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: store_intelligence_prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - store_intelligence_network

  grafana:
    image: grafana/grafana:latest
    container_name: store_intelligence_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - store_intelligence_network

volumes:
  postgres_data:
  grafana_data:

networks:
  store_intelligence_network:
    driver: bridge
